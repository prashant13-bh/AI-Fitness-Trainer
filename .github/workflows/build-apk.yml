name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Next.js Static Export
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder' }}

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/MaxxDaddy.ai.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/AI-Fitness-Trainer.apk
          echo "APK successfully generated at build-output/MaxxDaddy.ai.apk"
          ls -lh build-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxxDaddy-AI-APK
          path: build-output/MaxxDaddy.ai.apk
          retention-days: 30

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: maxxdaddy-v1.0
          name: "MaxxDaddy.ai Android APK (v1.0)"
          make_latest: true
          body: |
            ## 👑 MaxxDaddy.ai - LooksMaxx, BodyMaxx & Winter Arc Platform

            **Direct Download:**
            Download `MaxxDaddy.ai.apk` below and install it directly on your Android mobile device!

            ### Core Capabilities:
            - 👑 **MaxxDaddy.ai Aesthetics & LooksMaxx Platform**
            - 🎯 **90-Day Winter Arc Transformation Protocol & Habit Tracker**
            - 📱 **Mobile In-App AI Camera** (Real-Time MoveNet + WebGL on mobile GPU - Zero Python required!)
            - 🗣️ **Live Voice Coaching & Real-Time Biomechanics HUD**
            - ⏱️ **Lock-In Focus Timer & Deep Work Protocols**
            - 📊 **Progress Analytics & Offline-First Local Storage**

            *Compiled automatically via GitHub Actions CI/CD.*
          files: |
            build-output/MaxxDaddy.ai.apk
            build-output/AI-Fitness-Trainer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
